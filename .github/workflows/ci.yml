# Continuous Integration - runs on every PR and push
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

  server-test:
    name: Server Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rsvp
          POSTGRES_PASSWORD: rsvp
          POSTGRES_DB: rsvp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsvp -d rsvp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      TEST_DATABASE_URL: postgres://rsvp:rsvp@localhost:5432/rsvp_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-24.04
    needs: [lint-and-test, server-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d --build --wait

      - name: Run smoke tests
        run: bash docker/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
